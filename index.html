// Standalone Groq connection. The user enters their own API key in Settings.
sample = standaloneGroq;
async function standaloneGroq(input, options={}) {
  const apiKey = localStorage.getItem("mrl_groq_key");
  if (!apiKey) throw new Error("No Groq API key saved. Open Settings and add your key.");
  const messages = [{role:"system", content:SYS}].concat(
    (Array.isArray(input) ? input : [{role:"user", content:String(input)}])
      .map(m => ({role: (m.role === "assistant" || m.role === "model") ? "assistant" : "user",
        content:String(m.content ?? "")}))
  );
  const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method:"POST",
    headers:{"Content-Type":"application/json", "Authorization":"Bearer "+apiKey},
    body:JSON.stringify({model:"openai/gpt-oss-120b", messages, temperature:0.7, max_completion_tokens:options.max_completion_tokens ?? 4096})
  });
  const data = await response.json().catch(()=>({}));
  if (!response.ok) throw new Error(data?.error?.message || ("Groq request failed ("+response.status+")."));
  const text = data.choices?.[0]?.message?.content || "";
  if (!text) throw new Error("Groq returned no text. Check your API key, model access, or rate limits.");
  if (typeof options.onText === "function") options.onText({text});
  return {text};
}
async function ask(p,o={}){if(!sample)throw new Error("AI link unavailable.");return sample(p,{cache:false,...o})}
function settings(){

  $("#v").innerHTML=`<div class="card">
    <b style="color:var(--ac)">AI connection — Groq</b>
    <p class="dim">Mr L uses Groq's hosted GPT-OSS 120B model. Create a Groq API key, then paste it below. Your key is saved in this browser on this device; it is not written into the app file. The free tier has usage limits and is not unlimited.</p>
    <p><a href="https://console.groq.com/keys" target="_blank" rel="noopener" style="color:var(--ac)">Open Groq Console — API keys ↗</a></p>
    <label for="groqkey">Groq API key</label>
    <input id="groqkey" class="w" type="password" autocomplete="off" placeholder="Paste your Groq API key here" value="${existing.replace(/&/g,"&amp;").replace(/"/g,"&quot;")}">
    <div class="row" style="margin-top:10px"><button class="b" onclick="saveGroqKey()">Save key</button><button class="b" onclick="testGroqKey()">Test connection</button><button class="b" onclick="clearGroqKey()">Forget key</button></div>
    <div id="keystatus" class="dim">Key ${existing?"saved on this device":"not set"}.</div>
    <p class="dim">Security: this is a personal prototype. Do not embed a private API key directly in a public app's source code. Anyone with access to this browser profile may be able to use the saved key. Monitor your Groq usage and keep billing disabled if you want to avoid charges.</p>
  </div>`;
}
function saveGroqKey(){
  const k=$("#groqkey").value.trim();
  if(!k){$("#keystatus").textContent="Paste a key first.";return}
  localStorage.setItem("mrl_groq_key",k);
  $("#keystatus").textContent="Key saved in this browser. Tap Test connection.";
  $("#st").textContent="// Groq key saved";
}
function clearGroqKey(){
  localStorage.removeItem("mrl_groq_key");
  $("#groqkey").value="";
  $("#keystatus").textContent="Key removed from this browser.";
  $("#st").textContent="// AI key not set";
}
async function testGroqKey(){
  const k=$("#groqkey").value.trim();
  if(!k){$("#keystatus").textContent="Paste a key first.";return}
  localStorage.setItem("mrl_groq_key",k);

}
/* matrix rain */
const cv=$("#rain"),cx=cv.getContext("2d");let cols=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight;cols=Array(Math.ceil(cv.width/16)).fill(0).map(()=>Math.random()*50)}
addEventListener("resize",rs);rs();
setInterval(()=>{cx.fillStyle="rgba(1,10,4,.12)";cx.fillRect(0,0,cv.width,cv.height);cx.font="14px monospace";
cols.forEach((y,i)=>{cx.fillStyle=Math.random()>.97?"#caffdc":"#0fa84a";cx.beginPath();cx.arc(i*16+8,y*16,Math.random()>.9?2.4:1.5,0,7);cx.fill();cols[i]=y*16>cv.height&&Math.random()>.975?0:y+1})},55);

/* globe */
const gc=$("#globe"),gx=gc.getContext("2d"),P=[];
for(let i=0;i<900;i++){const y=1-2*(i+.5)/900,r=Math.sqrt(1-y*y),a=i*2.39996;P.push([Math.cos(a)*r,y,Math.sin(a)*r])}
let ry=0,rx=.4,vy=.004,vx=0,dg=false,lx=0,ly=0;
function gs(){gc.width=innerWidth;gc.height=innerHeight}addEventListener("resize",gs);gs();
addEventListener("pointerdown",e=>{dg=true;lx=e.clientX;ly=e.clientY});
addEventListener("pointerup",()=>dg=false);addEventListener("pointercancel",()=>dg=false);
addEventListener("pointermove",e=>{if(!dg)return;vy=(e.clientX-lx)*.004;vx=(e.clientY-ly)*.004;lx=e.clientX;ly=e.clientY});
function gd(){gx.clearRect(0,0,gc.width,gc.height);ry+=vy;rx+=vx;vx*=.95;if(!dg)vy+=(.004-vy)*.02;
const R=Math.min(gc.width,gc.height)*.36,cx0=gc.width/2,cy0=gc.height/2,cr=Math.cos(rx),sr=Math.sin(rx),cY=Math.cos(ry),sY=Math.sin(ry);
for(const p of P){let x=p[0]*cY+p[2]*sY,z=-p[0]*sY+p[2]*cY,y=p[1]*cr-z*sr;z=p[1]*sr+z*cr;const d=(z+1)/2;
gx.fillStyle="rgba(0,255,106,"+(.12+.7*d)+")";gx.beginPath();gx.arc(cx0+x*R,cy0+y*R,.8+1.6*d,0,7);gx.fill()}
gx.strokeStyle="rgba(0,255,106,.25)";gx.lineWidth=1;gx.beginPath();gx.arc(cx0,cy0,R,0,7);gx.stroke();requestAnimationFrame(gd)}gd();
/* nav */
const T={chat:"Mr L",elite:"Elite",cross:"Crossover",drill:"Drills",vault:"Vault",trends:"Trends",syl:"Syllabus",settings:"Settings"};let tab="chat";
function nav(){$("#nav").innerHTML=Object.entries(T).map(([k,v])=>`<button class="${k==tab?"on":""}" onclick="go('${k}')">${v}</button>`).join("")}

// Render LaTeX in AI answers and study questions instead of showing raw commands.
function typesetMath(el){
  if(!el) return;
  const run=()=>{if(window.MathJax && MathJax.typesetPromise){try{MathJax.typesetClear([el]);}catch(_){} MathJax.typesetPromise([el]).catch(()=>{});}};
  if(window.MathJax && MathJax.startup && MathJax.startup.promise){MathJax.startup.promise.then(run).catch(()=>{});}
  else {window.addEventListener("load",run,{once:true}); setTimeout(run,1800);}
}
/* chat */
function chat(){$("#v").innerHTML=`<div id="log"></div><div class="row" style="position:sticky;bottom:0"><textarea id="q" rows="2" placeholder="Ask Mr L anything…"></textarea><button class="b" onclick="send()">Send</button></div>`;
hist.forEach(m=>add(m.role=="user"?"me":"ai",m.content));if(!hist.length)add("ai","Good day. Mr L at your service. Chemistry, Physics, Maths: what shall we conquer first?")}

/* generator pages */
function gen(kind){return`<div class="card"><div class="row"><select id="s" onchange="fillCh('#s','#c')">${so()}</select><select id="c">${chs("Chemistry")}</select><button class="b" onclick="run('${kind}')">Generate</button></div><div id="out" class="dim">Ready when you are.</div></div>`}

async function run(k){const o=$("#out");o.textContent="Composing a worthy challenge…";let p;
if(k=="elite")p=`Write ONE extremely hard, elite Cambridge A-Level ${$("#s").value} question on "${$("#c").value}". It must require deep chapter knowledge plus logical, out-of-the-box thinking, in strict Cambridge structured style (parts (a),(b),(c) with marks), fully within the syllabus. Then, after a line '=== MARK SCHEME ===', give a full mark scheme with method marks (M), accuracy (A), and key examiner notes.`;
else p=`Write ONE hard Cambridge-style crossover question combining ${$("#s1").value} and ${$("#s2").value}${$("#t").value?" focusing on "+$("#t").value:""}, where answering needs real A-Level Maths techniques (e.g. integration, differential equations, partial fractions, binomial expansion) applied inside the science context (e.g. rate equations, equilibria, kinematics). Cambridge structured format with marks, within both syllabuses. Then after '=== MARK SCHEME ===' give a full mark scheme.`;
try{if(!sample){try{sample=await claude.use("sample")}catch(_){}}const r=await ask(p,{modelTier:"default",onText:({text})=>{o.innerHTML='<div class="msg ai">'+md(text)+'</div>';typesetMath(o)}});const[q,m]=r.text.split("=== MARK SCHEME ===");

function drill(){$("#v").innerHTML=`<div class="card"><div class="row"><select id="s" onchange="fillCh('#s','#c');info()">${so()}</select><select id="c" onchange="info()">${chs("Chemistry")}</select></div><div id="inf" class="dim"></div><div class="row" style="margin-top:10px"><button class="b" onclick="start()">Start drill</button><button class="b" onclick="fill()">Generate 10 more (needs internet)</button></div></div><div id="qa"></div>`;info()}
function info(){const k=key($("#s").value,$("#c").value),n=(D.bank[k]||[]).length,s=D.stat[k]||{a:0,c:0};$("#inf").textContent=`${n}/50 questions saved · accuracy ${s.a?Math.round(100*s.c/s.a):0}% (${s.c}/${s.a}). Saved questions work offline.`}
async function fill(){const s=$("#s").value,c=$("#c").value,k=key(s,c);$("#inf").textContent="Generating…";
try{const r=await ask(`Create 10 rapid Cambridge A-Level ${s} paper-1 style multiple-choice questions on "${c}", 4 options (A–D), varied difficulty. Reply with ONLY a JSON array: [{"q":"...","o":["...","...","...","..."],"a":0,"e":"short explanation"}] where a is the index of the correct option.`,{modelTier:"complex"});
const arr=JSON.parse(r.text.replace(/```json|```/g,"").trim());D.bank[k]=(D.bank[k]||[]).concat(arr);save()}catch(e){alert("Could not generate: "+e.message)}info()}
function start(){const s=$("#s").value,c=$("#c").value,k=key(s,c),b=D.bank[k]||[];if(!b.length){$("#qa").innerHTML='<div class="card dim">No questions saved yet. Tap “Generate 10 more” while online.</div>';return}
const w=D.stat[k]&&D.stat[k].wrong||[];const pool=b.map((q,i)=>i).sort((x,y)=>(w.includes(y)-w.includes(x))||Math.random()-.5);cur={k,pool,i:0};show()}
function show(){const q=D.bank[cur.k][cur.pool[cur.i%cur.pool.length]];$("#qa").innerHTML=`<div class="card"><div class="dim">Question ${cur.i+1}</div><p>${md(q.q)}</p>${q.o.map((o,j)=>`<button class="b opt" onclick="pick(${j},this)">${"ABCD"[j]}. ${md(o)}</button>`).join("")}<div id="ex"></div></div>`;typesetMath($("#qa"))}
function pick(j,el){const id=cur.pool[cur.i%cur.pool.length],q=D.bank[cur.k][id],s=D.stat[cur.k]=D.stat[cur.k]||{a:0,c:0,wrong:[]};s.wrong=s.wrong||[];s.a++;
document.querySelectorAll(".opt").forEach((b,i)=>{b.disabled=true;if(i==q.a)b.classList.add("r")});
if(j==q.a){s.c++;s.wrong=s.wrong.filter(x=>x!=id)}else{el.classList.add("w");if(!s.wrong.includes(id))s.wrong.push(id)}save();
$("#ex").innerHTML=`<p class="dim">${md(q.e||"")}</p><button class="b" onclick="cur.i++;show()">Next</button>`;typesetMath($("#ex"))}

async function txtPages(f){const L=await pdfLib(),d=await L.getDocument({data:await f.arrayBuffer()}).promise,a=[];for(let i=1;i<=d.numPages;i++){const c=await (await d.getPage(i)).getTextContent();a.push('[p'+i+'] '+c.items.map(x=>x.str).join(' '))}return a}

function vs(s){const P=Object.values(D.vault.papers).filter(p=>p.s==s);if(!P.length)return 'none';const m={};P.forEach(p=>p.qs.forEach(q=>{if(!q.ch)return;const e=m[q.ch]=m[q.ch]||{n:0,mk:0,y:{}};e.n++;e.mk+=q.m||1;e.y[p.y]=(e.y[p.y]||0)+1}));return P.length+' papers ('+[...new Set(P.map(p=>p.y))].sort().join(',')+'). '+Object.entries(m).map(([c,e])=>c+': '+e.n+' qs, '+e.mk+' marks, by year '+JSON.stringify(e.y)).join('; ')}
function vault(){$('#v').innerHTML=`<div class='card'><b style='color:var(--ac)'>Paper Vault</b><p class='dim'>Select Cambridge past-paper PDFs: question papers and mark schemes together, with their original file names (e.g. 9701_w23_qp_42.pdf). Text is read on your device, then each question is tagged by chapter and saved. Practical papers (3 and 5) are skipped. Start with 5 to 10 papers.</p><input type='file' id='fl' multiple accept='.pdf'><div class='row' style='margin-top:10px'><button class='b' onclick='vp()'>Process papers</button></div><div id='vlog' class='dim' style='white-space:pre-wrap'></div></div><div class='card' id='vst'></div><div class='card'><div class='row'><select id='s' onchange="fillCh('#s','#c')">${so()}</select><select id='c'>${chs('Chemistry')}</select><button class='b' onclick='vb()'>Browse chapter</button></div><div id='vbr'></div></div>`;vstat()}
function vstat(){const P=Object.values(D.vault.papers);$('#vst').innerHTML=Object.keys(SUBJ).map(s=>{const a=P.filter(p=>p.s==s);return `<div>${s}: ${a.length} papers, ${a.reduce((n,p)=>n+p.qs.length,0)} questions saved</div>`}).join('')}
async function vp(){const L=$('#vlog'),G={},lines=[];const lg=m=>{lines.push(m);L.textContent=lines.slice(-8).join('\n')};
[...$('#fl').files].forEach(f=>{const m=f.name.match(/(\d{4})_([smw])(\d{2})_(qp|ms)_(\d)(\d)?/i);if(!m)return;const id=m[1]+'_'+m[2]+m[3]+'_'+m[5]+(m[6]||'');(G[id]=G[id]||{c:m[1],y:2000+ +m[3],se:m[2],p:+m[5]})[m[4].toLowerCase()]=f});
const ids=Object.keys(G).filter(i=>G[i].qp&&SC[G[i].c]&&![3,5].includes(G[i].p)&&!D.vault.papers[i]);
if(!ids.length){lg('Nothing new to process. Check the file names and that question papers are included.');return}
let n=0;for(const id of ids){const g=G[id],s=SC[g.c],mcq=g.p==1&&g.c!='9709';lg(`(${++n}/${ids.length}) reading ${id}`);
if(mcq&&!g.ms){lg('Skipped '+id+': MCQ needs its mark scheme');continue}
try{
const qpages=await txtPages(g.qp),msPages=g.ms?await txtPages(g.ms):[],list=JSON.stringify(SUBJ[s]);
// Keep each request well below Groq's 8,000-token request budget: one paper page, one related mark-scheme page, and a smaller output allowance.
const chunks=[];
for(let i=0;i<qpages.length;i++){
  const raw=qpages[i];
  for(let off=0;off<raw.length;off+=4500)chunks.push({text:raw.slice(off,off+4500),from:i+1,to:i+1,part:Math.floor(off/4500)+1});
}
const all=[];
for(let ci=0;ci<chunks.length;ci++){
 const ch=chunks[ci];
 // Match mark-scheme pages proportionally to question-paper sections, instead of attaching the entire mark scheme every time.
 const msIndex=msPages.length?Math.min(msPages.length-1,Math.floor(ci*msPages.length/chunks.length)):-1;
 const mt=msIndex>=0?String(msPages[msIndex]).slice(0,2500):'';
 lg(`Processing ${id}: page ${ch.from}${ch.part>1?' (section '+ch.part+')':''} (${ci+1}/${chunks.length})`);
 const p=(mcq?`Extract every multiple-choice question visible in this section of the Cambridge ${s} paper using the supplied mark-scheme excerpt if relevant. Skip questions that depend on a diagram, graph or table. Return ONLY a JSON array: [{"ch":"chapter","q":"question","o":["A text","B text","C text","D text"],"a":0,"e":"explanation under 15 words"}] where a is the index of the correct option.`:`Extract one entry per numbered question visible in this section of the Cambridge ${s} paper. Return ONLY a JSON array: [{"n":"1","ch":"chapter","m":total marks as a number,"st":"style, e.g. calculation, explain, data analysis, mechanism, graph","cmd":"main command word","q":"condensed question under 250 characters","ms":"key mark scheme points under 250 characters, or empty"}].`)+` ch must be exactly one of: ${list}. Only extract questions supported by this section; do not invent missing text. If the mark-scheme excerpt does not contain the answer, leave the answer/explanation blank or use only what is clearly supported.

PAPER SECTION (page ${ch.from}):
${ch.text}

RELATED MARK-SCHEME EXCERPT (page ${msIndex+1}, may not contain every answer):
${mt}`;
 const r=await ask(p,{modelTier:'default',max_completion_tokens:1500}),qs=JSON.parse(r.text.replace(/```json|```/g,'').trim());
 qs.forEach(q=>{if(!SUBJ[s].includes(q.ch))q.ch=''});all.push(...qs);
}
if(mcq){for(const q of all){if(q.ch&&Array.isArray(q.o)&&q.o.length==4&&Number.isInteger(q.a)){const k=key(s,q.ch);(D.bank[k]=D.bank[k]||[]).push({q:q.q,o:q.o,a:q.a,e:q.e||'',src:id})}}}
D.vault.papers[id]={s,y:g.y,se:g.se,p:g.p,mcq,qs:all};
try{localStorage.setItem('mrl',JSON.stringify(D))}catch(e){delete D.vault.papers[id];lg('Storage full: stopped. Process fewer papers.');break}
lg('Saved '+id+': '+all.length+' questions')
}catch(e){lg('Failed '+id+': '+(e.code||'')+' '+(e.message||e));if(e.code=='rate_limited'){lg('Rate limit reached. Run Process again later: finished papers are kept.');break}}
}
vstat()}
function vb(){const s=$('#s').value,c=$('#c').value,o=[];for(const [id,p] of Object.entries(D.vault.papers))if(p.s==s)p.qs.forEach((q,i)=>{if(q.ch==c)o.push([id,i,p,q])});
$('#vbr').innerHTML=o.length?o.map(([id,i,p,q])=>`<div class='msg ai' style='margin-top:8px'><b>${p.y} ${p.se.toUpperCase()} P${p.p} ${q.n||''}</b> <span class='dim'>${q.m?q.m+' marks · ':''}${md(q.st||q.cmd||'')}</span>\n${md(String(q.q).slice(0,300))}${q.ms?'\n\nMark scheme: '+md(q.ms):''}\n<select data-id='${id}' data-i='${i}' onchange='mv(this.dataset.id,+this.dataset.i,this.value)'>${SUBJ[s].map(x=>`<option ${x==c?'selected':''}>${x}</option>`).join('')}</select></div>`).join(''):'<p class="dim">No saved questions for this chapter yet.</p>'}
function mv(id,i,c){const p=D.vault.papers[id],q=p.qs[i],old=q.ch;q.ch=c;if(p.mcq){const bo=D.bank[key(p.s,old)]||[],j=bo.findIndex(b=>b.src==id&&b.q==q.q);if(j>-1){const [b]=bo.splice(j,1);(D.bank[key(p.s,c)]=D.bank[key(p.s,c)]||[]).push(b)}}save();vb()}
/* trends */
function trends(){$("#v").innerHTML=`<div class="card"><div class="row"><select id="s">${so()}</select><button class="b" onclick="tr()">Analyse trends</button></div><textarea id="pp" rows="5" placeholder="Optional but powerful: paste past-paper questions or topic lists by year (e.g. 2023 Nov P4: Q1 kinetics, Q2 transition elements…). More data means better estimates."></textarea><p class="dim">These are informed estimates, not guarantees. Cambridge does not publish what will appear.</p></div><div id="tout"></div>`}
async function tr(){const s=$("#s").value,o=$("#tout"),pp=$("#pp").value.trim();o.innerHTML='<div class="card dim">Analysing patterns…</div>';
const me=SUBJ[s].map(c=>{const t=D.stat[key(s,c)];return t&&t.a?c+": "+Math.round(100*t.c/t.a)+"% of "+t.a:null}).filter(Boolean).join("; ")||"no data yet";
try{const r=await ask(`Analyse Cambridge International AS & A Level ${s} (${CODE[s]}) exam trends. Chapters: ${JSON.stringify(SUBJ[s])}. ${pp?"Past-paper data supplied by the student (weigh this most): "+pp:"No past-paper data supplied: rely on your knowledge of past papers and examiner reports, and say so."} Student accuracy so far: ${me}. Real counts from the student's own past-paper vault (treat as primary evidence, count-based): ${vs(s)}. Reply with ONLY JSON: {"chapters":[{"c":"exact chapter name","l":"High|Medium|Low","why":"one short sentence on frequency and typical question type"}],"styles":["recurring question styles or command words"],"plan":"a focused revision plan weighting likely chapters against the student's weak ones"}. Include every chapter. Be honest about uncertainty.`,{modelTier:"default"});
const j=JSON.parse(r.text.replace(/```json|```/g,"").trim()),rk={High:0,Medium:1,Low:2},col={High:"var(--no)",Medium:"#ffd24d",Low:"var(--dim)"};
o.innerHTML=`<div class="card"><b style="color:var(--ac)">Likelihood ranking</b>${j.chapters.sort((a,b)=>rk[a.l]-rk[b.l]).map(x=>`<div style="margin-top:8px"><b style="color:${col[x.l]}">${x.l}</b> · ${md(x.c)}<div class="dim">${md(x.why)}</div></div>`).join("")}</div><div class="card"><b style="color:var(--ac)">Question styles</b><div class="msg ai" style="margin-top:8px">${j.styles.map(md).join("\n• ").replace(/^/,"• ")}</div></div><div class="card"><b style="color:var(--ac)">Your revision plan</b><div class="msg ai" style="margin-top:8px">${md(j.plan)}</div></div>`;typesetMath(o)}catch(e){o.innerHTML='<div class="card">Analysis failed: '+md(e.message||String(e))+'. Try again.</div>'}}
/* syllabus with objectives */
const CODE={Chemistry:"9701",Physics:"9702",Maths:"9709"};
function syl2(){D.obj=D.obj||{};$("#v").innerHTML='<div class="card dim">Tap any chapter to open its learning objectives. They are fetched once, then saved for offline use. Always check against the official Cambridge syllabus PDF for the exact wording.</div>'+Object.entries(SUBJ).map(([s,l])=>`<div class="card"><b style="color:var(--ac)">${s} ${CODE[s]} · ${l.length} chapters</b>${l.map((c,i)=>{const t=D.stat[key(s,c)]||{a:0,c:0},p=t.a?Math.round(100*t.c/t.a):0;return`<div style="margin-top:10px"><div style="display:flex;justify-content:space-between;cursor:pointer;gap:8px" onclick="tg('${s}',${i})"><span>▸ ${c}</span><span class="dim">${t.a?p+'%':'new'}</span></div><div class="bar"><i style="width:${p}%"></i></div><div id="o${s}${i}" class="msg ai" hidden style="margin:8px 0 0"></div></div>`}).join("")}</div>`).join("")}
async function tg(s,i){const el=document.getElementById("o"+s+i);if(!el.hidden){el.hidden=true;return}el.hidden=false;const c=SUBJ[s][i],k="obj|"+s+"|"+c;if(D.obj[k]){el.textContent=D.obj[k];return}el.textContent="Retrieving learning objectives…";
try{const r=await ask(`List the learning outcomes for Cambridge International AS & A Level ${s} (${CODE[s]}), topic "${c}" (current syllabus). Organise by sub-topic number (e.g. 1.1, 1.2) with numbered outcomes under each, following the official syllabus structure and wording as closely as you can. Mark any point you are not certain of with (verify). Plain text only: no markdown symbols, no preamble, no closing remarks.`,{modelTier:"default",onText:({text})=>{el.textContent=text}});D.obj[k]=r.text;save();el.textContent=r.text;typesetMath(el)}catch(e){el.textContent="Could not load: "+(e.message||e);typesetMath(el)}}
/* syllabus */
function syl(){$("#v").innerHTML=Object.entries(SUBJ).map(([s,l])=>`<div class="card"><b style="color:var(--ac)">${s}</b>${l.map(c=>{const t=D.stat[key(s,c)]||{a:0,c:0},p=t.a?Math.round(100*t.c/t.a):0;return`<div style="margin-top:10px"><div style="display:flex;justify-content:space-between"><span>${c}</span><span class="dim">${t.a?p+"% · "+t.a+" attempts":"not started"}</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join("")}</div>`).join("")}
$("#st").textContent=localStorage.getItem("mrl_groq_key")?"// Groq key saved":"// AI key not set";
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}));
}
nav();chat();
</script></body></html>
